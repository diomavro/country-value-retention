[project]
name = "country-value-retention"
version = "0.1.0"
description = "Auditable accounting of where value generated in a country ultimately accrues"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Diomides Mavroyiannis", email = "dmavroyiannis8@gmail.com" }]
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "polars>=1.9",
  "pyarrow>=17",
  "numpy>=2.0",
  "scipy>=1.14",
  "networkx>=3.3",
  "requests>=2.32",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "matplotlib>=3.9",
  "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pypandoc-binary>=1.17",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvr"]
